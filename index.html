<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#0B2135">
<title>Competities</title>
<style>
/* Layout: scorebord-app. Navy kop met tabbladen, daaronder kaarten per wedstrijd; telefoon eerst, op breed scherm twee kolommen. */
:root{
  --bg:#EDF1EE; --surface:#FFFFFF; --surface2:#F5F7F5; --ink:#0E1E2F; --muted:#56666F; --line:#D3DBD6;
  --navy:#0B2135; --navy-ink:#F2F5F7; --green:#1F5C3A; --green-soft:#DCEBE1; --gold:#A87B22; --gold-soft:#F4E8CC;
  --bad:#B3261E; --bad-soft:#F8DEDC; --good:#256B45; --focus:#2F6FB3;
  --f-display:"Bahnschrift SemiCondensed","Roboto Condensed","Arial Narrow","Liberation Sans Narrow",Arial,sans-serif;
  --f-body:system-ui,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#08131E; --surface:#0F2134; --surface2:#132940; --ink:#E7EDF2; --muted:#9AAAB8; --line:#22394F;
  --navy:#06121D; --navy-ink:#F2F5F7; --green:#5DB088; --green-soft:#173B2B; --gold:#DDB45E; --gold-soft:#3A2F17;
  --bad:#F0857C; --bad-soft:#3D1D1B; --good:#6CC496; --focus:#7FB2EA; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#08131E; --surface:#0F2134; --surface2:#132940; --ink:#E7EDF2; --muted:#9AAAB8; --line:#22394F;
  --navy:#06121D; --navy-ink:#F2F5F7; --green:#5DB088; --green-soft:#173B2B; --gold:#DDB45E; --gold-soft:#3A2F17;
  --bad:#F0857C; --bad-soft:#3D1D1B; --good:#6CC496; --focus:#7FB2EA; color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;margin:0}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--navy);color:var(--navy-ink);border-bottom:3px solid var(--gold)}
.top-in{max-width:1100px;margin:0 auto;padding:12px 16px 0}
.brand{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand h1{font-family:var(--f-display);font-weight:700;font-size:1.55rem;letter-spacing:.01em;margin:0;text-wrap:balance}
.brand .sub{font-size:.85rem;opacity:.8}
.brand-r{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.hbtn{border:1px solid var(--gold);background:none;color:var(--navy-ink);border-radius:999px;padding:4px 12px;font-weight:700;font-size:.82rem;cursor:pointer}
.hbtn.on{background:var(--gold);color:var(--navy);border-color:var(--gold)}
.tabs{display:flex;gap:2px;overflow-x:auto;margin-top:10px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{background:none;border:0;padding:10px 12px 9px;font-family:var(--f-display);font-weight:600;font-size:1rem;letter-spacing:.03em;text-transform:uppercase;color:var(--navy-ink);opacity:.7;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-3px;white-space:nowrap}
.tab[aria-selected="true"]{opacity:1;border-bottom-color:var(--gold)}
main{max-width:1100px;margin:0 auto;padding-inline:16px;padding-block:16px 48px}
.note{color:var(--muted);font-size:.9rem;margin:0 0 12px}
.banner{background:var(--gold-soft);border:1px solid var(--gold);border-radius:var(--r);padding:10px 12px;margin-bottom:14px;font-size:.92rem}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;cursor:pointer;font-weight:600;font-size:.9rem}
.chip[aria-pressed="true"]{background:var(--green);border-color:var(--green);color:var(--surface)}
.chip .dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-left:6px;vertical-align:middle;background:var(--line)}
.chip .dot.done{background:var(--good)} .chip .dot.busy{background:var(--gold)}
.grid2{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,480px),1fr))}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;min-width:0}
.card-h{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 14px;background:var(--green);color:var(--surface)}
.card-h.final{background:var(--navy);color:var(--navy-ink)}
.card-h .lbl{font-family:var(--f-display);font-weight:600;letter-spacing:.04em;text-transform:uppercase;font-size:.85rem;opacity:.9}
.card-h .teams{font-family:var(--f-display);font-weight:700;font-size:1.2rem}
.score{font-family:var(--f-display);font-weight:700;font-size:1.5rem;font-variant-numeric:tabular-nums;white-space:nowrap}
.duo{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;padding:10px 12px;border-top:1px solid var(--line)}
.duo:first-of-type{border-top:0}
.side{min-width:0;display:flex;flex-direction:column;gap:6px}
.side.r{align-items:flex-end;text-align:right}
.names{font-size:.88rem;line-height:1.25;overflow-wrap:anywhere}
.names .h{color:var(--muted);font-variant-numeric:tabular-nums}
.mid{text-align:center;min-width:64px}
.mid .n{font-family:var(--f-display);font-weight:700;font-size:.8rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.mid .t{font-variant-numeric:tabular-nums;font-size:.85rem;color:var(--muted)}
.mid .p{font-family:var(--f-display);font-weight:700;font-size:1.1rem;font-variant-numeric:tabular-nums}
.step{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface2)}
.step button{width:38px;height:38px;border:0;background:none;font-size:1.25rem;cursor:pointer;font-weight:700}
.step button:disabled{opacity:.35;cursor:default}
.step .v{min-width:30px;text-align:center;font-family:var(--f-display);font-weight:700;font-size:1.25rem;font-variant-numeric:tabular-nums}
.step.win{border-color:var(--good);background:var(--green-soft)}
.cap{font-size:.75rem;color:var(--muted)}
.foot{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px;align-items:center;padding:10px 14px;background:var(--surface2);border-top:1px solid var(--line);font-size:.9rem}
.pill{display:inline-block;border-radius:999px;padding:2px 10px;font-size:.8rem;font-weight:700;letter-spacing:.02em}
.pill.ok{background:var(--green-soft);color:var(--good)} .pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.wait{background:var(--surface2);color:var(--muted);border:1px solid var(--line)} .pill.gold{background:var(--gold-soft);color:var(--gold)}
.linkbtn{background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;font-size:.8rem;padding:0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:7px 0;width:40px;cursor:pointer;font-weight:700}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--green);color:var(--surface)}
.seg.wide button{width:auto;padding:7px 12px}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{font-family:var(--f-display);font-weight:600;letter-spacing:.04em;text-transform:uppercase;font-size:.78rem;color:var(--muted);white-space:nowrap}
td.num,th.num{text-align:right}
.rank{font-family:var(--f-display);font-weight:700;font-size:1.15rem}
h2{font-family:var(--f-display);font-weight:700;font-size:1.25rem;margin:22px 0 10px;text-wrap:balance}
h2:first-child{margin-top:0}
.pl{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:8px 14px;border-top:1px solid var(--line)}
.pl:first-child{border-top:0}
.pl .nm{min-width:0;overflow-wrap:anywhere}
.pl .nm small{color:var(--muted);font-variant-numeric:tabular-nums}
.duolist{padding:10px 14px;background:var(--surface2);border-top:1px solid var(--line);display:grid;gap:4px;font-size:.92rem}
.duolist b{font-family:var(--f-display)}
.form{display:grid;gap:10px;padding:14px}
.row{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(min(100%,160px),1fr));align-items:end}
label.f{display:grid;gap:4px;font-size:.82rem;color:var(--muted);font-weight:600;min-width:0}
input[type=text],input[type=number],input[type=date],input[type=time],select{width:100%;min-width:0;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface2);font-size:.95rem;color:var(--ink)}
.rost{display:grid;grid-template-columns:minmax(0,1fr) 70px auto;gap:6px;align-items:center;padding:6px 14px}
.rost.head{font-size:.75rem;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding-top:10px}
.btn{border:1px solid var(--green);background:var(--green);color:var(--surface);border-radius:8px;padding:8px 14px;font-weight:700;cursor:pointer}
.btn.ghost{background:var(--surface);color:var(--green)}
.btn.danger{border-color:var(--bad);background:var(--surface);color:var(--bad)}
.btn:disabled{opacity:.45;cursor:default}
.actions{display:flex;flex-wrap:wrap;gap:8px;padding:0 14px 14px}
.empty{padding:22px 16px;text-align:center;color:var(--muted)}
.check-grid td{font-size:.85rem}
.sl-time{font-family:var(--f-display);font-weight:700;font-size:1.05rem}
.toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--navy);color:var(--navy-ink);padding:10px 16px;border-radius:8px;font-size:.9rem;max-width:calc(100% - 32px);z-index:10}
@media (max-width:420px){ .step button{width:34px;height:36px} .mid{min-width:54px} .duo{padding:10px 8px;gap:6px} }
@media (prefers-reduced-motion:no-preference){ .step button:active{transform:scale(.94)} }
textarea{width:100%;min-width:0;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface2);font:inherit;font-size:.92rem;color:var(--ink);resize:vertical;font-family:ui-monospace,Consolas,monospace}
.csel{width:auto;max-width:260px;padding:4px 8px;border:1px solid var(--gold);border-radius:999px;background:var(--navy);color:var(--navy-ink);font-weight:700;font-size:.82rem}
.gridp{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(min(100%,190px),1fr))}
.pv{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--surface2);font-size:.88rem;display:grid;gap:2px}
.pv b{font-family:var(--f-display)}
.note.warn{color:var(--bad)}
code{font-size:.85em;background:var(--surface2);padding:1px 4px;border-radius:4px}
</style>
</head>
<body>
<header class="top"><div class="top-in">
  <div class="brand"><h1 id="title">Competities</h1><span class="brand-r"><span class="sub" id="subtitle"></span><select id="compsel" class="csel" aria-label="Kies competitie" hidden></select><span id="authbtn"></span></span></div>
  <nav class="tabs" role="tablist" id="tabs"></nav>
</div></header>
<main id="view"><div class="empty">De competities worden geladen…</div></main>
<div class="toast" id="toast" hidden></div>

<script src="config.js"></script>
<script>
(function(){
"use strict";
const RULES={vrij:"Vrij (koppels vrij)",laag2:"Laagste twee niet in duo 3",auto:"Automatisch op handicap"};
const FINALS={beide:"Grote finale en troostfinale",groot:"Alleen grote finale",geen:"Geen finales"};
const MAXT=10, MAXP=8;
const BASETABS=[["uitslagen","Uitslagen"],["opstelling","Opstelling"],["stand","Stand"],["startlijst","Startlijst"],["instellingen","Instellingen"]];

const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const nl=x=>String(x).replace(".",",");
const num=v=>{if(v===""||v==null)return null; const n=Number(String(v).replace(",","."));return isFinite(n)?n:null;};
const rid=()=>Math.random().toString(36).slice(2,9);
function toast(msg){const el=$("#toast");el.textContent=msg;el.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>el.hidden=true,3500);}
function addMin(hhmm,min){const [h,m]=String(hhmm||"00:00").split(":").map(Number);const t=(h*60+m+min+1440)%1440;return String(Math.floor(t/60)).padStart(2,"0")+":"+String(t%60).padStart(2,"0");}
function fmtDate(d){if(!d)return "";const p=d.split("-");return p.length===3?`${+p[2]}-${+p[1]}-${p[0]}`:d;}

/* ---------- speelschema voor N teams ---------- */
// Halve competitie volgens het rondsysteem (team 1 vast, de rest draait). Bij een oneven aantal is per ronde één team vrij.
function buildPlan(N,finals){
  const arr=[];for(let i=1;i<=N;i++)arr.push(i); if(N%2)arr.push(0);
  const n=arr.length, R=n-1, matches=[], byes={}; let m=0, rot=arr.slice(1);
  for(let r=0;r<R;r++){
    const a=[arr[0],...rot];
    for(let i=0;i<n/2;i++){let x=a[i],y=a[n-1-i]; if(!x||!y){byes[r+1]=x||y;continue;} if(x>y)[x,y]=[y,x]; matches.push({m:++m,s:r+1,L:x,R:y});}
    rot=[rot[rot.length-1],...rot.slice(0,-1)];
  }
  const poule=m; let fs=null;
  if(finals!=="geen"){fs=R+1;
    if(finals==="beide") matches.push({m:++m,s:fs,fase:"Troostfinale",seeds:[3,4]});
    matches.push({m:++m,s:fs,fase:"Grote finale",seeds:[1,2]});}
  return {N,R,matches,byes,poule,fs,nSess:R+(fs?1:0)};
}
function finalsFor(N,f){if(f==="beide"&&N>=4)return f; if(f==="groot"&&N>=2)return f; if(f==="geen")return f; return N>=4?"beide":N===3?"groot":"geen";}
function normCfg(raw){
  const c=Object.assign({name:"Competitie",baan:"",interval:10,teams:[],sessions:null,sched:[],playoff:{},finals:null},raw?JSON.parse(JSON.stringify(raw)):{});
  if(!Array.isArray(c.teams)) c.teams=[];
  c.teams=c.teams.slice(0,MAXT).map((t,i)=>({name:(t&&t.name)||("Team "+(i+1)),rule:(t&&RULES[t.rule])?t.rule:"vrij"}));
  while(c.teams.length<2) c.teams.push({name:"Team "+(c.teams.length+1),rule:"vrij"});
  const N=c.teams.length; c.finals=finalsFor(N,c.finals);
  const P=buildPlan(N,c.finals);
  if(!Array.isArray(c.sessions)){
    if(N===4&&("dag1" in c||"dag2" in c)) c.sessions=[{label:"Dag 1 ochtend",date:c.dag1||""},{label:"Dag 1 middag",date:c.dag1||""},{label:"Dag 2 ochtend",date:c.dag2||""},{label:"Finales",date:c.dag2||""}];
    else c.sessions=[];
  }
  delete c.dag1; delete c.dag2;
  for(let i=0;i<P.nSess;i++){const s=c.sessions[i]||{}; c.sessions[i]={label:s.label||(i<P.R?"Ronde "+(i+1):"Finales"),date:s.date||""};}
  c.sessions.length=P.nSess;
  if(!Array.isArray(c.sched)) c.sched=[];
  for(const mt of P.matches){if(!c.sched[mt.m-1]||!c.sched[mt.m-1].t){const k=P.matches.filter(x=>x.s===mt.s).indexOf(mt);c.sched[mt.m-1]={t:addMin("09:00",k*30),tee:1};}}
  c.sched.length=P.matches.length;
  if(!c.playoff||typeof c.playoff!=="object") c.playoff={};
  return c;
}

/* ---------- namen anonimiseren (gebeurt alleen in deze browser) ---------- */
const TV=new Set(["van","de","der","den","het","ten","ter","te","in","op","uit","'t","t","’t","d'","du","la","le","von","zu","di","da","del","dos","das","el","al","bij","aan","onder","over","vd","v.d.","v/d"]);
const SUFRE=/\s*(\([^)]*\)|©)\s*$/;
const baseName=n=>String(n||"").replace(SUFRE,"").trim().toLowerCase();
const capW=x=>x.charAt(0).toUpperCase()+x.slice(1).toLowerCase();
function splitName(raw){
  let s=String(raw||"").replace(/ /g," ").replace(/\s+/g," ").trim(), suffix="";
  const m=s.match(SUFRE); if(m){suffix=/^\(c\)$/i.test(m[1])?"©":m[1]; s=s.slice(0,m.index).trim();}
  if(s.includes(",")){const [a,b]=s.split(",").map(x=>x.trim()); if(a&&b) s=b+" "+a;}
  const p=s.split(" ").filter(Boolean);
  if(p.length<2) return {fixed:s,suffix};
  if(p.length===2&&/^\p{Lu}\p{Ll}{0,2}\.$/u.test(p[1])) return {fixed:s,suffix};
  let j=p.length-2; while(j>=1&&TV.has(p[j].toLowerCase())) j--;
  const core=p[p.length-1].replace(/^['’]+/,"").replace(/[^\p{L}-]/gu,"");
  return {given:p.slice(0,j+1).join(" "),core:core||p[p.length-1],suffix};
}
// Maakt van volledige namen "Voornaam L."; bij dubbelen meer letters van de achternaam. taken = namen die al bestaan.
function anonNames(raws,taken){
  const o=raws.map(splitName), len=o.map(()=>1), tk=new Set([...(taken||[])].map(baseName));
  const disp=i=>o[i].fixed!=null?o[i].fixed:`${o[i].given} ${capW(o[i].core.slice(0,len[i]))}.`;
  for(let round=0;round<12;round++){
    const names=o.map((_,i)=>disp(i).toLowerCase()); let changed=false;
    const others=i=>[...tk,...names.filter((_,k)=>k!==i)];
    o.forEach((x,i)=>{if(x.fixed!=null)return; const pre=names[i].slice(0,-1);
      const dup=others(i).some(nm=>nm===names[i]||(nm.startsWith(pre)&&nm.length>names[i].length&&nm.charAt(pre.length)!==" "));
      if(dup&&len[i]<Math.min(3,x.core.length-1)){len[i]++;changed=true;}});
    if(!changed) break;
  }
  const out=[], seen=new Set(tk);
  o.forEach((x,i)=>{let b=disp(i),nm=b,k=2; while(seen.has(nm.toLowerCase())) nm=b+" "+(k++); seen.add(nm.toLowerCase()); out.push(nm+(x.suffix?" "+x.suffix:""));});
  return out;
}
const looksFull=n=>{const x=splitName(n);return x.fixed==null;};
function toHcp(s){const t=String(s).trim();const plus=t.startsWith("+");const v=num(t.replace("+",""));if(v==null||v>54)return null;return plus?-v:v;}
// Tekst met teams en spelers lezen. Kopregel: eindigt op ":" of begint met "Team:". Spelerregel: naam, daarna eventueel handicap.
// Kopregel (teamnaam): eindigt op ":" of begint met "Team:", of een regel zonder handicap na een lege regel
// (of bovenaan) met daaronder spelers. Staat er nergens een handicap, dan is elke regel een teamnaam.
function parseTeams(text,allowTeams){
  const L=[]; let blank=true;
  for(const raw of String(text||"").split(/\r?\n/)){
    const t=raw.replace(/\u00a0/g," ").trim(); if(!t){blank=true;continue;}
    const hm=t.match(/^team\s*:\s*(.+)$/i)||(/:\s*$/.test(t)&&!t.includes("\t")?[0,t.replace(/:\s*$/,"")]:null);
    let name="",hcp=null,suffix="";
    if(!hm){
      const cells=t.includes("\t")?t.split("\t"):t.includes(";")?t.split(";"):null;
      if(cells){const c=cells.map(x=>x.trim()).filter(Boolean); name=c[0]||""; for(const x of c.slice(1)){if(hcp==null&&/^\+?-?\d{1,2}([.,]\d+)?$/.test(x))hcp=toHcp(x);else if(SUFRE.test(" "+x))suffix=x;}}
      else{let s=t;for(let k=0;k<3;k++){let m;
        if((m=s.match(/\s+(\([^)]*\)|©)$/))){suffix=m[1];s=s.slice(0,m.index);}
        else if(hcp==null&&(m=s.match(/\s+(\+?-?\d{1,2}(?:[.,]\d+)?)$/))){hcp=toHcp(m[1]);s=s.slice(0,m.index);}
        else break;} name=s.trim();
        // "Heren 1", "Team 3": één woord plus een heel getal is een teamnaam, geen speler met handicap
        if(allowTeams&&hcp!=null&&!/\s/.test(name)&&!/[.,+]/.test(t.replace(name,""))){name=t;hcp=null;suffix="";}}
    }
    L.push({head:hm?hm[1].trim():null,name,hcp,suffix,blank,raw:t}); blank=false;
  }
  const teams=[]; let cur=null;
  const anyHcp=L.some(x=>x.hcp!=null), anyHead=L.some(x=>x.head!=null);
  L.forEach((x,i)=>{
    let head=x.head;
    if(allowTeams&&head==null&&!x.suffix){
      if(!anyHcp&&!anyHead) head=x.raw;
      else if(x.hcp==null&&x.blank){const nx=L[i+1]; if(nx&&nx.head==null&&nx.hcp!=null&&!nx.blank) head=x.raw;}
    }
    if(head!=null){ if(allowTeams){cur={name:head,players:[]};teams.push(cur);} return; }
    if(!x.name) return;
    if(!cur){cur={name:"",players:[]};teams.push(cur);}
    cur.players.push({raw:x.name+(x.suffix?" "+x.suffix:""),hcp:x.hcp});
  });

function lineup(t,s){
  const roster=S.rosters[t]||[], assign=(S.lineups[`t${t}r${s}`]||{}).assign||{};
  const rule=(cfg().teams[t-1]||{}).rule||"vrij";
  const idx=new Map(roster.map((p,i)=>[p.id,i]));
  const hc=p=>{const n=num(p.hcp);return n==null?99:n;};
  const byH=(a,b)=>hc(a)-hc(b)||idx.get(a.id)-idx.get(b.id);
  const playing=roster.filter(p=>assign[p.id]);
  const res={rule,playing,duos:[],status:"leeg",msg:"Nog niet ingevuld"};
  if(!playing.length) return res;
  let pairs=[];
  if(rule==="auto"){
    if(playing.length!==6) return Object.assign(res,{status:"fout",msg:`Kies precies 6 spelers (nu ${playing.length})`});
    const srt=playing.slice().sort(byH); pairs=[[srt[0],srt[1],"1"],[srt[2],srt[3],"2"],[srt[4],srt[5],"3"]];
  } else {
    const g={A:[],B:[],C:[]};
    for(const p of playing){const k=assign[p.id]; if(!g[k]) return Object.assign(res,{status:"fout",msg:"Kies voor elke speler A, B of C"}); g[k].push(p);}
    if(playing.length!==6||g.A.length!==2||g.B.length!==2||g.C.length!==2)
      return Object.assign(res,{status:"fout",msg:"Er moeten 3 koppels van 2 spelers zijn (A, B en C)"});
    pairs=[[...g.A,"A"],[...g.B,"B"],[...g.C,"C"]];
  }
  res.duos=pairs.map(([a,b,k])=>{const pl=[a,b].sort(byH);return {players:pl,sum:Math.round((hc(a)+hc(b))*10)/10,key:k};})
    .sort((x,y)=>x.sum-y.sum||String(x.key).localeCompare(String(y.key)));
  res.status="ok"; res.msg="OK";
  if(rule==="laag2"){
    const low=playing.slice().sort(byH).slice(0,2).map(p=>p.id);
    const off=res.duos[2].players.filter(p=>low.includes(p.id));
    if(off.length===1){res.status="fout";res.msg=`${off[0].name} hoort bij de twee laagste handicaps en staat in duo 3`;}
    if(off.length===2){res.status="fout";res.msg="De twee laagste handicaps staan samen in duo 3";}
  }
  return res;
}
function duoRes(m,d){const r=S.results[`m${m}d${d}`]||{};const l=num(r.l),rr=num(r.r);
  return {l,r:rr,done:l!=null&&rr!=null,pl:l!=null&&rr!=null?(l>rr?1:l===rr?.5:0):null};}
function tot(m){let pl=0,pr=0,hl=0,hr=0,n=0;for(let d=1;d<=3;d++){const x=duoRes(m,d);if(x.done){n++;pl+=x.pl;pr+=1-x.pl;hl+=x.l;hr+=x.r;}}return {pl,pr,hl,hr,n};}
function standings(){
  const N=NT(), st={};for(let t=1;t<=N;t++)st[t]={t,pts:0,holes:0,W:0,G:0,V:0,played:0,vs:{}};
  let entered=0;
  for(const mt of PLAN.matches.filter(x=>!x.fase)){
    const x=tot(mt.m); entered+=x.n; const A=st[mt.L],B=st[mt.R];
    A.pts+=x.pl;B.pts+=x.pr;A.holes+=x.hl;B.holes+=x.hr;A.vs[mt.R]=x.pl;B.vs[mt.L]=x.pr;
    if(x.n===3){A.played++;B.played++; if(x.pl>x.pr){A.W++;B.V++;}else if(x.pl<x.pr){A.V++;B.W++;}else{A.G++;B.G++;}}
  }
  const total=PLAN.poule*3, complete=entered===total, po=cfg().playoff||{};
  const arr=Object.values(st);
  for(const a of arr){a.h2h=arr.filter(b=>b.t!==a.t&&b.pts===a.pts&&b.holes===a.holes).reduce((s,b)=>s+(a.vs[b.t]||0),0);
    a.po=num(po[a.t]); a.key=a.pts*1e6+a.holes*1e3+a.h2h*10-(a.po||0)*0.1;}
  for(const a of arr){a.rank=1+arr.filter(b=>b.key>a.key+1e-6).length;}
  const tie=arr.some(a=>arr.filter(b=>b.rank===a.rank).length>1);
  arr.sort((a,b)=>a.rank-b.rank||a.t-b.t); arr.forEach((a,i)=>a.seed=i+1);
  return {rows:arr,complete,entered,total,tie};
}
function teamsOf(mt,stand){
  if(mt.L) return [mt.L,mt.R];

    else {store.view[c]=code;persist();}
    ui.login=false;ui.badCode=false;needCode=false;canWrite=!!r.canEdit;version=r.version;applyState(r.docs||{});render();
    toast(r.admin?"Beheer staat aan voor alle competities.":r.canEdit?"Invoer staat aan.":"Welkom. Je kijkt mee.");
  }catch(e){
    if(e&&e.code==="toegang_geweigerd"){ui.badCode=true;render();}
    else toast("Geen verbinding. Probeer het opnieuw.");
  }
}

/* ---------- interactie ---------- */
document.addEventListener("submit",e=>{
  if(e.target.id!=="login") return; e.preventDefault();
  e.target.dataset.sig="x";
  doLogin(document.getElementById("code-in").value.trim());
});
document.addEventListener("input",e=>{
  const el=e.target,d=el.dataset;
  if(d.nc){ui.nc[d.nc]=el.value; if(d.nc==="text"){const p=$("#nc-prev");if(p)p.innerHTML=ncPreview();} if(ui.ncErr){ui.ncErr=ncError();const e2=$("#nc-err");if(e2)e2.textContent=ui.ncErr;} return;}
  if(d.cc){ui.cc[d.cc]=el.value;return;}
  if(d.paste&&ui.paste){ui.paste.text=el.value;const p=$("#paste-prev");if(p)p.innerHTML=pastePreview();}
});
document.addEventListener("click",async e=>{
  const b=e.target.closest("button"); if(!b) return;
  const d=b.dataset;
  if(d.tab){ui.tab=d.tab;try{localStorage.setItem("tc.tab",d.tab);}catch(_){}window.scrollTo(0,0);render();return;}
  if(d.sess){ui.sess=+d.sess;render();return;}
  if(d.login){ui.login=true;ui.badCode=false;render();return;}
  if(d.logincancel){ui.login=false;ui.badCode=false;render();return;}
  if(d.logout){const wasAdmin=isAdmin;store.admin="";delete store.edit[compId];persist();isAdmin=false;canWrite=false;version=-1;
    if(wasAdmin){await loadList();if(ui.tab==="beheer")ui.tab="uitslagen";}
    render();if(compId)poll();toast(wasAdmin?"Beheer gestopt.":"Invoeren gestopt. Je kijkt nu alleen mee.");return;}
  if(d.export){const blob=new Blob([JSON.stringify({app:"training-competitie",competitie:cfg().name,exported:new Date().toISOString(),version,docs:lastDocs},null,1)],{type:"application/json"});const a=document.createElement("a");
    const slug=String(cfg().name||"competitie").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
    a.href=URL.createObjectURL(blob);a.download=slug+"-"+new Date().toISOString().slice(0,10)+".json";document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);return;}
  if(d.team){ui.team=+d.team;render();return;}
  if(d.round){ui.round=+d.round;render();return;}
  // beheer
  if(isAdmin){
    if(d.open){ui.tab="uitslagen";switchComp(d.open);return;}
    if(d.copy){const url=location.origin+location.pathname+"?c="+encodeURIComponent(d.copy);
      try{await navigator.clipboard.writeText(url);toast("Link gekopieerd.");}catch(_){toast(url);}return;}
    if(d.codes){ui.codesFor=d.codes;ui.cc={edit:"",view:""};ui.delFor=null;render();return;}
    if(d.ccno){ui.codesFor=null;ui.cc={edit:"",view:""};render();return;}
    if(d.ccsave){try{await rpc("tc_admin",{p_code:store.admin,p_action:"codes",p_args:{comp:d.ccsave,edit:ui.cc.edit.trim(),view:ui.cc.view.trim()}});
        ui.codesFor=null;ui.cc={edit:"",view:""};await loadList();if(d.ccsave===compId){delete store.edit[compId];delete store.view[compId];persist();version=-1;poll();}render();toast("Codes opgeslagen.");}
      catch(err){toast(codeErr(err));}return;}
    if(d.delc){ui.delFor=d.delc;ui.codesFor=null;render();return;}
    if(d.delcno){ui.delFor=null;render();return;}
    if(d.delcok){try{await rpc("tc_admin",{p_code:store.admin,p_action:"delete",p_args:{comp:d.delcok}});ui.delFor=null;delete store.edit[d.delcok];delete store.view[d.delcok];persist();
        await loadList();toast("Competitie verwijderd.");if(d.delcok===compId){switchComp(comps.length?comps[0].id:null);ui.tab="beheer";render();}else render();}
      catch(err){toast(codeErr(err));}return;}
    if(d.create){await createComp();return;}
  }
  if(!canWrite) return;
  if(d.impno){ui.importDocs=null;render();return;}
  if(d.impok){const docs=ui.importDocs;ui.importDocs=null;rpc("tc_import",{p_comp:compId,p_code:authCode(),p_docs:docs}).then(()=>{toast("Gegevens teruggezet.");version=-1;poll();}).catch(err=>toast(err&&err.code==="toegang_geweigerd"?"Terugzetten geweigerd: geen invoerrechten.":"Terugzetten mislukt."));render();return;}
  if(d.step){const [m,du,side,dl]=d.step.split("|");const k=`m${m}d${du}`;const r=Object.assign({},S.results[k]||{});
    const cur=num(r[side]); let nv=cur==null?(+dl>0?1:0):cur+ +dl; nv=Math.max(0,Math.min(9,nv)); r[side]=nv; S.results[k]=r; saveResult(k); render(); return;}
  if(d.clear){const [m,du]=d.clear.split("|");const k=`m${m}d${du}`;S.results[k]={};saveResult(k);render();return;}
  if(d.sd){const [m,w]=d.sd.split("|");const k=`m${m}sd`;const cur=(S.results[k]||{}).w;S.results[k]={w:cur===w?"":w};saveResult(k);render();return;}
  if(d.assign){const [pid,v]=d.assign.split("|");const key=`t${ui.team}r${ui.round}`;const cur=S.lineups[key]||{assign:{}};const as=Object.assign({},cur.assign);
    if(v)as[pid]=v;else delete as[pid];S.lineups[key]={assign:as};saveLineup(ui.team,ui.round);render();return;}
  if(d.add){const t=+d.add;const r=(S.rosters[t]||[]).slice();if(r.length>=MAXP)return;r.push({id:rid(),name:"",hcp:""});S.rosters[t]=r;saveRoster(t);render();
    const last=r[r.length-1];setTimeout(()=>{const el=document.getElementById("p-n-"+last.id);if(el)el.focus();},0);return;}
  if(d.pastetoggle){ui.paste={t:+d.pastetoggle,text:""};render();setTimeout(()=>{const el=document.getElementById("paste-"+d.pastetoggle);if(el)el.focus();},0);return;}
  if(d.pasteno){ui.paste=null;render();return;}
  if(d.pasteadd){const t=+d.pasteadd;const parsed=parseTeams(ui.paste?ui.paste.text:"",false);if(!parsed.length){toast("Er is niets geplakt.");return;}
    const an=anonTeams(parsed,allNames())[0];const r=(S.rosters[t]||[]).slice();const room=MAXP-r.length;
    an.players.slice(0,room).forEach(p=>r.push({id:rid(),name:p.name,hcp:p.hcp==null?"":p.hcp}));S.rosters[t]=r;saveRoster(t);ui.paste=null;render();
    toast(`${Math.min(room,an.players.length)} speler(s) toegevoegd aan ${tname(t)}.`);return;}
  if(d.sort){const t=+d.sort;const r=(S.rosters[t]||[]).slice();r.sort((a,b)=>{const x=num(a.hcp),y=num(b.hcp);return (x==null?99:x)-(y==null?99:y);});S.rosters[t]=r;saveRoster(t);render();toast("Spelers gesorteerd op handicap.");return;}
  if(d.del){ui.confirmDel=d.del;render();return;}
  if(d.delno){ui.confirmDel=null;render();return;}
  if(d.delok){const [t,pid]=d.delok.split("|");S.rosters[t]=(S.rosters[t]||[]).filter(p=>p.id!==pid);ui.confirmDel=null;saveRoster(+t);
    for(let s=1;s<=12;s++){const k=`t${t}r${s}`;if(S.lineups[k]&&S.lineups[k].assign[pid]){const as=Object.assign({},S.lineups[k].assign);delete as[pid];S.lineups[k]={assign:as};saveLineup(+t,s);}}
    render();return;}
  if(d.addteam){if(anyResults()||NT()>=MAXT)return;const c=S.cfg;c.teams.push({name:"Team "+(c.teams.length+1),rule:"vrij"});c.sched=[];setCfg(c);saveCfg();render();return;}
  if(d.delteam){if(anyResults()||NT()<=2)return;const c=S.cfg;const n=c.teams.length;c.teams.pop();c.sched=[];setCfg(c);saveCfg();S.rosters[n]=[];saveRoster(n);render();toast("Laatste team verwijderd.");return;}
});
function codeErr(err){const c=err&&err.code;return ({invoercode_te_kort:"De invoercode moet minstens 8 tekens hebben.",kijkcode_te_kort:"De kijkcode moet minstens 6 tekens hebben (of leeg laten).",
  codes_gelijk:"Invoercode en kijkcode moeten verschillen.",zelfde_als_beheercode:"Gebruik voor de competitie een andere code dan de beheercode.",toegang_geweigerd:"Geweigerd: de beheercode klopt niet (meer).",
  ongeldige_gegevens:"De gegevens zijn ongeldig.",te_veel_competities:"Maximaal 50 competities.",onbekende_competitie:"Deze competitie bestaat niet meer."})[c]||"Opslaan mislukt. Controleer je internetverbinding.";}
function ncError(){
  const name=ui.nc.name.trim(), n=parseTeams(ui.nc.text,true).length, edit=ui.nc.edit.trim(), view=ui.nc.view.trim();
  if(!name) return "Vul een naam voor de competitie in.";
  if(n<2||n>MAXT) return `Een competitie heeft 2 tot ${MAXT} teams; nu gevonden: ${n}.`;
  if(edit.length<8) return "De invoercode moet minstens 8 tekens hebben.";
  if(view&&view.length<6) return "De kijkcode moet minstens 6 tekens hebben (of leeg laten).";
  if(view&&view===edit) return "Invoercode en kijkcode moeten verschillen.";
  return "";
}
async function createComp(){
  const name=ui.nc.name.trim(), parsed=parseTeams(ui.nc.text,true), edit=ui.nc.edit.trim(), view=ui.nc.view.trim();
  const ve=ncError(); if(ve){ui.ncErr=ve;render();toast(ve);return;}
  const teams=anonTeams(parsed,[]);
  const c=normCfg({name,teams:teams.map(t=>({name:t.name,rule:"vrij"}))});
  const docs={"config/main":c};
  teams.forEach((t,i)=>{docs["rosters/t"+(i+1)]={players:t.players.slice(0,MAXP).map(p=>({id:rid(),name:p.name,hcp:p.hcp==null?"":p.hcp}))};});
  ui.busy=true;render();
  try{const r=await rpc("tc_admin",{p_code:store.admin,p_action:"create",p_args:{docs,edit,view}});
    ui.nc={name:"",text:"",edit:"",view:""};ui.ncErr="";ui.busy=false;await loadList();ui.tab="instellingen";switchComp(r.id);
    toast("Competitie aangemaakt. Vul nu de speeldata en tijden in.");}
  catch(err){ui.busy=false;ui.ncErr="Niet aangemaakt: "+codeErr(err);render();toast(ui.ncErr);}
}
document.addEventListener("change",e=>{
  const el=e.target, d=el.dataset;
  if(el.id==="compsel"){ui.paste=null;switchComp(el.value);return;}
  if(d.nc||d.cc||d.paste) return;
  if(el.id==="imp-file"){const f=el.files&&el.files[0]; if(!f) return; f.text().then(t=>{let j;try{j=JSON.parse(t);}catch(_){toast("Dit is geen geldig exportbestand.");return;}
    const docs=j&&j.docs?j.docs:j; if(!docs||typeof docs!=="object"||!docs["config/main"]){toast("Dit is geen exportbestand van de Training Competitie.");return;}
    ui.importDocs=docs;ui.importName=f.name;render();});el.value="";return;}
  if(!canWrite||!S.cfg) return;
  const c=S.cfg;
  if(d.cfg){c[d.cfg]=d.cfg==="interval"?(num(el.value)||10):el.value; if(d.cfg==="finals"){if(finalResults())return; c.sched=c.sched.slice(0,PLAN.poule);} setCfg(c);saveCfg();}
  else if(d.sessL!=null){c.sessions[+d.sessL].label=el.value.trim()||("Ronde "+(+d.sessL+1));saveCfg();}
  else if(d.sessD!=null){c.sessions[+d.sessD].date=el.value;saveCfg();}
  else if(d.tname!=null){c.teams[+d.tname].name=el.value.trim()||("Team "+(+d.tname+1));saveCfg();}
  else if(d.trule!=null){c.teams[+d.trule].rule=el.value;saveCfg();}
  else if(d.sched){const [m,f]=d.sched.split("|");c.sched[m-1]=Object.assign({},c.sched[m-1],{[f]:f==="tee"?+el.value:el.value});saveCfg();}
  else if(d.po){c.playoff=Object.assign({},c.playoff,{[d.po]:el.value?+el.value:""});saveCfg();}
  else if(d.pl){const [t,pid,f]=d.pl.split("|");let v=el.value.trim();
    if(f==="name"&&v&&looksFull(v)){const nv=anonNames([v],allNames(pid))[0];if(nv!==v){el.value=nv;toast(`Opgeslagen als ${nv}.`);}v=nv;}
    S.rosters[t]=(S.rosters[t]||[]).map(p=>p.id!==pid?p:Object.assign({},p,{[f]:f==="hcp"?(toHcp(v)??""):v}));saveRoster(+t);}
  else return;
  setTimeout(render,0);
});
document.addEventListener("focusout",()=>{setTimeout(()=>{if(render.pending){const a=document.activeElement;if(!(a&&$("#view").contains(a)&&/^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName))){render.pending=false;render();}}},0);});

/* ---------- gegevens ophalen ---------- */
function applyState(docs){
  lastDocs=docs;
  const keep=(p,cur)=>pending.has(compId+"|"+p)&&cur;
  setCfg(keep("config/main",S.cfg)?S.cfg:docs["config/main"]);
  const R={},L={},X={};
  for(const [p,v] of Object.entries(docs)){
    const [col,id]=p.split("/");
    if(col==="rosters"){const t=+id.slice(1);R[t]=keep(p,S.rosters[t])?S.rosters[t]:(v.players||[]).map(x=>Object.assign({},x));}
    else if(col==="lineups"){L[id]=keep(p,S.lineups[id])?S.lineups[id]:{assign:Object.assign({},v.assign||{})};}
    else if(col==="results"){X[id]=keep(p,S.results[id])?S.results[id]:Object.assign({},v);}
  }
  for(const key of pending){const [cc,p]=key.split("|");if(cc!==compId)continue;const [col,id]=p.split("/");
    if(col==="rosters"&&!R[+id.slice(1)]&&S.rosters[+id.slice(1)])R[+id.slice(1)]=S.rosters[+id.slice(1)];
    if(col==="lineups"&&!L[id]&&S.lineups[id])L[id]=S.lineups[id];
    if(col==="results"&&!X[id]&&S.results[id])X[id]=S.results[id];}
  S.rosters=R;S.lineups=L;S.results=X;S.loaded=true;
}
let pollTimer=null;
async function poll(){
  clearTimeout(pollTimer);
  const c=compId;
  if(configured&&c){
    try{
      const code=authCode();
      const res=await rpc("tc_state",{p_comp:c,p_code:code,p_since:version});
      if(c!==compId) return;
      const changedAuth=needCode||canWrite!==!!res.canEdit||offline||isAdmin!==!!res.admin;
      offline=false; needCode=false;
      if(store.admin&&!res.admin){store.admin="";persist();await loadList();}
      if(!res.canEdit&&store.edit[c]){delete store.edit[c];persist();}
      if(res.canEdit&&!res.admin&&!store.edit[c]&&store.view[c]===code){store.edit[c]=code;delete store.view[c];persist();}
      canWrite=!!res.canEdit;
      if(!res.unchanged){version=res.version;applyState(res.docs||{});render();} else if(changedAuth) render();
    }catch(err){
      if(c!==compId) return;
      if(err&&err.code==="toegang_geweigerd"){
        if(store.view[c]){delete store.view[c];persist();}
        if(store.admin){store.admin="";persist();await loadList();}
        ui.badCode=false;needCode=true;canWrite=false;render();
      }else if(err&&err.code==="onbekende_competitie"){await loadList();switchComp(comps.length?comps[0].id:null);return;}
      else if(!offline){offline=true;render();}
    }
  }
  if(c===compId) pollTimer=setTimeout(poll,document.hidden?15000:3000);
}
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&compId)poll();});

async function start(){
  render();
  if(!configured) return;
  if(!await loadList()){render();setTimeout(start,5000);return;}
  let want=null; try{want=new URLSearchParams(location.search).get("c")||localStorage.getItem("tc.comp");}catch(e){}
  const id=comps.some(x=>x.id===want)?want:(comps[0]&&comps[0].id)||null;
  switchComp(id);
}
start();
})();
</script>
